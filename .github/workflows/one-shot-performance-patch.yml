name: One-shot performance patch

on:
  push:
    branches: [android-dev]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: run performance patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python tools/perf_patch.py
      - name: Commit
        run: |
          git config user.name "kairatpv-create"
          git config user.email "kairat.pv@gmail.com"
          git add -A
          git commit -m "perf: make YOLO recovery adaptive per series"
          git push origin android-dev
