name: Organizer Pro Web Hotfix Once

on:
  push:
    branches:
      - personal-organizer-web-v1-hotfix-work
    paths:
      - '.github/workflows/organizer-web-hotfix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-organizer-web-v1-hotfix-work
          fetch-depth: 0
          persist-credentials: true

      - name: Apply focused web fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app=Path('organizer-web/static/app.js')
          s=app.read_text()

          old="""function save(){\n  state.revision=Number(state.revision||0)+1;\n  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOk=true;}catch(e){storageOk=false;}\n  updateStorageStatus();\n}\n"""
          new="""function save(){\n  state.revision=Number(state.revision||0)+1;\n  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOk=true;}catch(e){storageOk=false;}\n  updateStorageStatus();\n  try{window.dispatchEvent(new CustomEvent('organizer:local-change'))}catch(e){}\n}\n"""
          assert old in s
          s=s.replace(old,new,1)

          old="""function switchSection(name){\n  currentSection=name;\n"""
          new="""function switchSection(name){\n  currentSection=name;\n  try{sessionStorage.setItem('organizer-current-section',name)}catch(e){}\n"""
          assert old in s
          s=s.replace(old,new,1)

          anchor="""function renderCurrent(){if(currentSection==='notes')renderNotes();else if(currentSection==='projects')renderProjects();else if(currentSection==='money')renderMoney();else renderSettings();}\n\n"""
          assert anchor in s
          bridge="""function renderCurrent(){if(currentSection==='notes')renderNotes();else if(currentSection==='projects')renderProjects();else if(currentSection==='money')renderMoney();else renderSettings();}\nfunction refreshFromCloud(){\n  var keepSection=currentSection,keepNote=selectedNote,keepProject=selectedProject;\n  try{\n    var raw=localStorage.getItem(STORAGE_KEY),parsed=raw?JSON.parse(raw):{};\n    state=Object.assign({notes:[],projects:[],stages:[],money:[],reminders:[],attachments:[],revision:1},parsed||{});\n    state.notes=Array.isArray(state.notes)?state.notes:[];\n    state.projects=Array.isArray(state.projects)?state.projects:[];\n    state.stages=Array.isArray(state.stages)?state.stages:[];\n    state.money=Array.isArray(state.money)?state.money:[];\n    state.reminders=Array.isArray(state.reminders)?state.reminders:[];\n    state.attachments=Array.isArray(state.attachments)?state.attachments:[];\n    var notes=active(state.notes),projects=active(state.projects);\n    selectedNote=findBy(notes,keepNote)?keepNote:(notes[0]?notes[0].id:'');\n    selectedProject=findBy(projects,keepProject)?keepProject:(projects[0]?projects[0].id:'');\n    currentSection=keepSection;\n    updateStorageStatus();\n    renderCurrent();\n  }catch(e){showFatal(e)}\n}\nwindow.addEventListener('organizer:cloud-applied',refreshFromCloud);\n\n"""
          s=s.replace(anchor,bridge,1)

          s=s.replace('Облачная синхронизация с Android будет подключена отдельным этапом после стабилизации локальной версии.','После входа данные синхронизируются с Android автоматически.')
          s=s.replace('Органайзер Про Web 0.2.0 Static','Органайзер Про Web 0.5.1')

          old="""  switchSection('notes');\n"""
          new="""  var first='notes';\n  try{first=sessionStorage.getItem('organizer-current-section')||'notes'}catch(e){}\n  if(['notes','projects','money','settings'].indexOf(first)<0)first='notes';\n  switchSection(first);\n"""
          assert old in s
          s=s.replace(old,new,1)
          app.write_text(s)

          sync=Path('organizer-web/static/sync.js')
          s=sync.read_text()
          s=s.replace("var API_BASE=(location.protocol==='file:'?'https://organizer-pro.app':'');","var API_BASE=(location.protocol==='file:'?'https://organizer-pro.onrender.com':'');")
          anchor="""function applyRemote(payload,rev,remoteSig){\n  var local=loadState();if(activeCount(local)>0)safety(local,'Перед получением данных из облака');\n  var b=JSON.parse(payload);saveState(fromBackup(b));setMeta({rev:Number(rev||0),lastSig:remoteSig,lastSyncAt:Date.now()});\n}\n"""
          assert anchor in s
          s=s.replace(anchor,anchor+"function notifyCloudApplied(){try{window.dispatchEvent(new CustomEvent('organizer:cloud-applied'))}catch(e){}}\n",1)
          s=s.replace("setTimeout(function(){location.reload()},250);","notifyCloudApplied();")
          s=s.replace("busy=true;updateTop('Синхронизация…');","busy=true;if(force)updateTop('Синхронизация…');")
          s=s.replace("if(b)b.textContent=s.token?'Аккаунт':'Войти';","if(b){var label=s.token?'Аккаунт':'Войти';if(b.textContent!==label)b.textContent=label;}")
          old="""document.addEventListener('input',function(){if(!suppress)scheduleSync()},true);document.addEventListener('change',function(){if(!suppress)scheduleSync()},true);document.addEventListener('click',function(){if(!suppress)scheduleSync()},true);\n"""
          new="""window.addEventListener('organizer:local-change',function(){if(!suppress)scheduleSync()});\n"""
          assert old in s
          s=s.replace(old,new,1)
          assert 'location.reload' not in s
          sync.write_text(s)

          css=Path('organizer-web/static/sync.css')
          c=css.read_text()
          if '#syncTopBtn{min-width:92px}' not in c:
            c += "\n#syncTopBtn{min-width:92px}.topbar .mode{min-width:190px;text-align:right;white-space:nowrap}\n"
          css.write_text(c)

          idx=Path('organizer-web/static/index.html')
          i=idx.read_text().replace('WEB 0.5.0','WEB 0.5.1')
          idx.write_text(i)

          sw=Path('organizer-web/static/sw.js')
          w=sw.read_text().replace("organizer-pro-web-0.5.0","organizer-pro-web-0.5.1")
          sw.write_text(w)

          wf=Path('.github/workflows/organizer-web-build.yml')
          w=wf.read_text()
          w=w.replace('Build Organizer Pro Web v0.5.0','Build Organizer Pro Web v0.5.1')
          w=w.replace("grep -q 'WEB 0.5.0'","grep -q 'WEB 0.5.1'")
          w=w.replace('Organizer-Pro-Web-v0.5.0','Organizer-Pro-Web-v0.5.1')
          wf.write_text(w)

          server=Path('organizer-sync-server/server.js')
          t=server.read_text().replace("web: '0.5.0', android: '0.9.29'","web: '0.5.1', android: '0.9.30'")
          server.write_text(t)

          Path('.github/workflows/organizer-web-hotfix-once.yml').unlink()
          PY

      - name: Verify syntax and focused fixes
        shell: bash
        run: |
          node --check organizer-web/static/app.js
          node --check organizer-web/static/sync.js
          node --check organizer-web/static/sw.js
          grep -q "organizer:cloud-applied" organizer-web/static/app.js
          grep -q "organizer:local-change" organizer-web/static/app.js
          grep -q "organizer:local-change" organizer-web/static/sync.js
          ! grep -q "location.reload" organizer-web/static/sync.js
          grep -q "WEB 0.5.1" organizer-web/static/index.html
          grep -q "organizer-pro-web-0.5.1" organizer-web/static/sw.js

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'kairatpv-create'
          git config user.email 'kairat.pv@gmail.com'
          git add -A
          git commit -m 'Fix Organizer Pro Web navigation and sync UI stability'
          git push origin HEAD:personal-organizer-web-v1-hotfix-work
