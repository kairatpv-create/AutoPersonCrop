name: Build Google Play AAB

on:
  push:
    branches: [android-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache exported LiteRT model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/person_detector.tflite
          key: yolo11n-litert-8.4.127-${{ hashFiles('tools/export_model.py') }}

      - name: Export YOLO11n to LiteRT
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ultralytics==8.4.127" "litert-torch>=0.9.0" "ai-edge-litert>=2.1.4"
          python tools/export_model.py

      - name: Verify model exists
        run: test -s app/src/main/assets/person_detector.tflite

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build unsigned release AAB
        shell: bash
        run: |
          set -o pipefail
          gradle :app:bundleRelease --stacktrace --no-daemon 2>&1 | tee play-build-output.txt

      - name: Download bundletool 1.18.3
        shell: bash
        run: |
          curl -fL \
            -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar

      - name: Validate Android App Bundle
        shell: bash
        run: |
          java -jar bundletool.jar validate --bundle app/build/outputs/bundle/release/app-release.aab
          java -jar bundletool.jar dump config --bundle app/build/outputs/bundle/release/app-release.aab | tee bundle-config.txt
          grep -q "PAGE_ALIGNMENT_16K" bundle-config.txt

      - name: Upload Play validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoPersonCrop-play-validation-log
          path: |
            play-build-output.txt
            bundle-config.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: AutoPersonCrop-play-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1
