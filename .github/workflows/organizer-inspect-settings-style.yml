name: Inspect Organizer Pro settings style

on:
  push:
    branches:
      - personal-organizer-v1
    paths:
      - '.github/workflows/organizer-inspect-settings-style.yml'

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v0.9.31 source without building
        shell: bash
        run: |
          head -n -1 organizer/build_v0931.sh > /tmp/reconstruct_v0931.sh
          bash /tmp/reconstruct_v0931.sh
      - name: Show SettingsCard and brand colors
        shell: bash
        run: |
          ROOT=organizer/buildsrc0106/Organizer-Pro-v0.9.31-source
          UI="$ROOT/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt"
          CLOUD="$ROOT/app/src/main/java/kz/kairat/organizer/CloudSync.kt"
          echo '=== BRAND COLORS ==='
          grep -n -B 8 -A 20 'fun brandCardColors' "$UI" || true
          grep -n -B 8 -A 20 'brandCardColors' "$UI" | head -80 || true
          echo '=== CLOUD CARD ==='
          grep -n -B 5 -A 70 '@Composable fun CloudSyncSettingsCard' "$CLOUD" || true
