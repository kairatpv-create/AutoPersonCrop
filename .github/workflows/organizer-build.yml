name: Build MyOrganizer v0.8.9

on:
  push:
    branches:
      - personal-organizer-v1
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild v0.8.8 base and apply v0.8.9
        shell: bash
        run: |
          mkdir -p organizer/buildsrc089
          cat organizer/chunks087/part00 organizer/chunks087/part01 organizer/chunks087/part02 organizer/chunks087/part03 organizer/chunks087/part04 organizer/chunks087/part05 organizer/chunks087/part06 > organizer/MyOrganizer-v0.8.7-source.zip
          unzip -q organizer/MyOrganizer-v0.8.7-source.zip -d organizer/buildsrc089
          cat organizer/patch088/part00 organizer/patch088/part01 organizer/patch088/part02 organizer/patch088/part03 organizer/patch088/part04 > organizer/v0.8.8.patch
          cd organizer/buildsrc089
          patch -p1 < ../v0.8.8.patch
          mv MyOrganizer-v0.8.7-source MyOrganizer-v0.8.8-source
          cd MyOrganizer-v0.8.8-source
          patch -p1 < ../../v0.8.9.patch
          cd ..
          mv MyOrganizer-v0.8.8-source MyOrganizer-v0.8.9-source

      - name: Build APK
        working-directory: organizer/buildsrc089/MyOrganizer-v0.8.9-source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyOrganizer-v0.8.9-debug
          path: organizer/buildsrc089/MyOrganizer-v0.8.9-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Collect signing tools
        shell: bash
        run: |
          mkdir -p organizer/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" organizer/signing-tools/lib/
          chmod +x organizer/signing-tools/apksigner organizer/signing-tools/zipalign

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35
          path: organizer/signing-tools
          if-no-files-found: error
          retention-days: 1
