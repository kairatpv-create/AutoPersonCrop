name: Build MyOrganizer v0.9.0

on:
  push:
    branches:
      - personal-organizer-v1
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore v0.9.0 source
        shell: bash
        run: |
          mkdir -p organizer/buildsrc090
          cat organizer/v090tar/part00 organizer/v090tar/part01 organizer/v090tar/part02 organizer/v090tar/part03 > organizer/MyOrganizer-v0.9.0-source.tar.xz.b64
          base64 -d organizer/MyOrganizer-v0.9.0-source.tar.xz.b64 > organizer/MyOrganizer-v0.9.0-source.tar.xz
          tar -xJf organizer/MyOrganizer-v0.9.0-source.tar.xz -C organizer/buildsrc090
          test -f organizer/buildsrc090/MyOrganizer-v0.9.0-source/app/build.gradle.kts
          sed -i 's/recorder.start("project_${project.id}")/recorder.start()/g' organizer/buildsrc090/MyOrganizer-v0.9.0-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt

      - name: Build APK
        working-directory: organizer/buildsrc090/MyOrganizer-v0.9.0-source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyOrganizer-v0.9.0-debug
          path: organizer/buildsrc090/MyOrganizer-v0.9.0-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Collect signing tools
        shell: bash
        run: |
          mkdir -p organizer/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" organizer/signing-tools/lib/
          chmod +x organizer/signing-tools/apksigner organizer/signing-tools/zipalign

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35
          path: organizer/signing-tools
          if-no-files-found: error
          retention-days: 1
