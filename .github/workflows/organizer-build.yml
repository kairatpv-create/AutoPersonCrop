name: Build Organizer Pro v0.9.16

on:
  push:
    branches:
      - personal-organizer-v1
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore v0.9.15 and apply v0.9.16 update
        shell: bash
        run: |
          python3 organizer/v0106/rebuild.py
          test -f organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/build.gradle.kts
          grep -q 'versionCode = 49' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/build.gradle.kts
          grep -q 'versionName = "0.9.16"' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/build.gradle.kts
          grep -q 'applicationId = "kz.kairat.organizer"' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/build.gradle.kts
          grep -q 'supportedLanguages = listOf("kk","ru","en","zh","de","es","fr","tr")' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/src/main/java/kz/kairat/organizer/AppStrings.kt
          grep -q 'SQLiteOpenHelper(context, "organizer.db", null, 9)' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/src/main/java/kz/kairat/organizer/NoteDatabase.kt
          grep -q 'titleLarge=TextStyle(fontSize=17.sp' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/src/main/java/kz/kairat/organizer/Theme.kt
          grep -q 'titleMedium=TextStyle(fontSize=15.sp' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/src/main/java/kz/kairat/organizer/Theme.kt
          grep -q 'bodyMedium=TextStyle(fontSize=14.sp' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/src/main/java/kz/kairat/organizer/Theme.kt
          grep -Fq 'val pillHeight=(44f*uiScale).dp' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt
          grep -Fq 'val pillHeight=(40f*uiScale).dp' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt
          grep -Fq 'val pillHeight=(32f*uiScale).dp' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt
          grep -q 'style=MaterialTheme.typography.labelLarge' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt
          grep -q 'basicMarquee(iterations=Int.MAX_VALUE' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt
          ! grep -q 'fixedTextSize' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt
          grep -q 'BottomTextNavPill(section=="settings"' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt
          ! grep -q 'Text(languagesLabel(lang)' organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt

      - name: Build APK
        working-directory: organizer/buildsrc0106/Organizer-Pro-v0.9.16-source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-v0.9.16-debug
          path: organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Archive source
        shell: bash
        run: |
          cd organizer/buildsrc0106
          zip -qr ../Organizer-Pro-v0.9.16-source.zip Organizer-Pro-v0.9.16-source

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-v0.9.16-source
          path: organizer/Organizer-Pro-v0.9.16-source.zip
          if-no-files-found: error
          retention-days: 1

      - name: Collect signing tools
        shell: bash
        run: |
          mkdir -p organizer/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" organizer/signing-tools/lib/
          chmod +x organizer/signing-tools/apksigner organizer/signing-tools/zipalign

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35
          path: organizer/signing-tools
          if-no-files-found: error
          retention-days: 1
