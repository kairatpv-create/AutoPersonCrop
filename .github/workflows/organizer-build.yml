name: Build MyOrganizer v0.9.1

on:
  push:
    branches:
      - personal-organizer-v1
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore v0.9.0 and apply multilingual v0.9.1
        shell: bash
        run: |
          mkdir -p organizer/buildsrc091
          cat organizer/v090tar/part00 organizer/v090tar/part01 organizer/v090tar/part02 organizer/v090tar/part03 > organizer/MyOrganizer-v0.9.0-source.tar.xz.b64
          base64 -d organizer/MyOrganizer-v0.9.0-source.tar.xz.b64 > organizer/MyOrganizer-v0.9.0-source.tar.xz
          tar -xJf organizer/MyOrganizer-v0.9.0-source.tar.xz -C organizer/buildsrc091
          test -f organizer/buildsrc091/MyOrganizer-v0.9.0-source/app/build.gradle.kts
          python3 - <<'PY'
          import base64,zlib,pathlib
          root=pathlib.Path('organizer/buildsrc091/MyOrganizer-v0.9.0-source')
          appstrings=zlib.decompress(base64.b64decode(pathlib.Path('organizer/v091/appstrings.zlib.b64').read_text())).decode()
          (root/'app/src/main/java/kz/kairat/organizer/AppStrings.kt').write_text(appstrings)
          apply_script=zlib.decompress(base64.b64decode(pathlib.Path('organizer/v091/apply.zlib.b64').read_text())).decode()
          pathlib.Path('organizer/apply_v091.py').write_text(apply_script)
          PY
          python3 organizer/apply_v091.py organizer/buildsrc091/MyOrganizer-v0.9.0-source
          mv organizer/buildsrc091/MyOrganizer-v0.9.0-source organizer/buildsrc091/MyOrganizer-v0.9.1-source
          grep -q 'versionCode = 34' organizer/buildsrc091/MyOrganizer-v0.9.1-source/app/build.gradle.kts
          grep -q 'versionName = "0.9.1"' organizer/buildsrc091/MyOrganizer-v0.9.1-source/app/build.gradle.kts
          grep -q 'supportedLanguages = listOf("ru","kk","en","zh","de","es","fr","tr")' organizer/buildsrc091/MyOrganizer-v0.9.1-source/app/src/main/java/kz/kairat/organizer/AppStrings.kt

      - name: Build APK
        working-directory: organizer/buildsrc091/MyOrganizer-v0.9.1-source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyOrganizer-v0.9.1-debug
          path: organizer/buildsrc091/MyOrganizer-v0.9.1-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Collect signing tools
        shell: bash
        run: |
          mkdir -p organizer/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" organizer/signing-tools/lib/
          chmod +x organizer/signing-tools/apksigner organizer/signing-tools/zipalign

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35
          path: organizer/signing-tools
          if-no-files-found: error
          retention-days: 1
