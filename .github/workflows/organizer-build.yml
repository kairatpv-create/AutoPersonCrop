name: Build MyOrganizer v0.8.0

on:
  push:
    branches:
      - personal-organizer-v1
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild source archive
        shell: bash
        run: |
          cat organizer/chunks/part* > organizer/MyOrganizer-v0.8.0-source.b64
          base64 -d organizer/MyOrganizer-v0.8.0-source.b64 > organizer/MyOrganizer-v0.8.0-source.zip
          unzip -q organizer/MyOrganizer-v0.8.0-source.zip -d organizer/buildsrc

      - name: Build APK
        working-directory: organizer/buildsrc/MyOrganizer-v0.8.0-source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyOrganizer-v0.8.0-debug
          path: organizer/buildsrc/MyOrganizer-v0.8.0-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
