name: Build Organizer Pro v0.9.33

on:
  push:
    branches:
      - personal-organizer-v1
    paths:
      - 'organizer/**'
      - '.github/workflows/organizer-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore or create stable Organizer Pro signing key
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p organizer/signing
          KEY="organizer/signing/organizer-pro-stable.jks"
          PASS="OrganizerProTest2026"
          ALIAS="organizerpro"

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=Organizer-Pro-stable-signing-key&per_page=100"
          JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API")
          URL=$(printf '%s' "$JSON" | python3 -c 'import json,sys; a=[x for x in json.load(sys.stdin).get("artifacts",[]) if not x.get("expired")]; a.sort(key=lambda x:x.get("created_at", "")); print(a[-1]["archive_download_url"] if a else "")')

          if [ -n "$URL" ]; then
            echo "Restoring stable signing key from previous Organizer Pro build artifact"
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$URL" -o /tmp/organizer-signing-key.zip
            unzip -qo /tmp/organizer-signing-key.zip -d organizer/signing
          fi

          if [ ! -f "$KEY" ]; then
            echo "No previous stable key artifact found; creating Organizer Pro stable TEST signing key"
            keytool -genkeypair -noprompt \
              -keystore "$KEY" \
              -storepass "$PASS" \
              -alias "$ALIAS" \
              -keypass "$PASS" \
              -dname "CN=Organizer Pro Test,O=Kairat,C=KZ" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

          keytool -list -v -keystore "$KEY" -storepass "$PASS" -alias "$ALIAS" | grep -E 'Alias name:|SHA256:'

      - name: Build and verify Organizer Pro v0.9.33
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if bash organizer/build_v0933.sh; then
              exit 0
            fi
            echo "Gradle attempt $attempt failed; waiting before retry..."
            sleep $((attempt*45))
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-v0.9.33-debug
          path: organizer/buildsrc0106/Organizer-Pro-v0.9.33-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Preserve stable Organizer Pro signing key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-stable-signing-key
          path: organizer/signing/organizer-pro-stable.jks
          if-no-files-found: error
          retention-days: 90
