name: Build MyOrganizer v0.8.3

on:
  push:
    branches:
      - personal-organizer-v1
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild source and apply v0.8.3 patch
        shell: bash
        run: |
          mkdir -p organizer/buildsrc083
          cat organizer/chunks081/part* > organizer/MyOrganizer-v0.8.1-source.b64
          base64 -d organizer/MyOrganizer-v0.8.1-source.b64 > organizer/MyOrganizer-v0.8.1-source.zip
          unzip -q organizer/MyOrganizer-v0.8.1-source.zip -d organizer/buildsrc083
          cat organizer/patch082/part* > organizer/v0.8.2.patch
          cd organizer/buildsrc083
          patch -p0 < ../v0.8.2.patch
          patch -p0 < ../fix082.patch
          mv MyOrganizer-v0.8.1-source MyOrganizer-v0.8.2-source
          patch -p0 < ../v0.8.3.patch

      - name: Build APK
        working-directory: organizer/buildsrc083/MyOrganizer-v0.8.2-source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyOrganizer-v0.8.3-debug
          path: organizer/buildsrc083/MyOrganizer-v0.8.2-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Collect signing tools
        shell: bash
        run: |
          mkdir -p organizer/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" organizer/signing-tools/lib/
          chmod +x organizer/signing-tools/apksigner organizer/signing-tools/zipalign

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35
          path: organizer/signing-tools
          if-no-files-found: error
