name: Build Organizer Pro v0.9.24

on:
  push:
    branches:
      - personal-organizer-v1
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        if: ${{ hashFiles('organizer/v0114/apply.py') != '' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        if: ${{ hashFiles('organizer/v0114/apply.py') != '' }}
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        if: ${{ hashFiles('organizer/v0114/apply.py') != '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore v0.9.23 and apply v0.9.24 calendar back navigation
        if: ${{ hashFiles('organizer/v0114/apply.py') != '' }}
        shell: bash
        run: |
          python3 organizer/v0106/rebuild.py
          test -f organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/build.gradle.kts
          python3 organizer/v0107/apply.py organizer/buildsrc0106/Organizer-Pro-v0.9.16-source
          mv organizer/buildsrc0106/Organizer-Pro-v0.9.16-source organizer/buildsrc0106/Organizer-Pro-v0.9.17-source
          python3 organizer/v0108/apply.py organizer/buildsrc0106/Organizer-Pro-v0.9.17-source
          mv organizer/buildsrc0106/Organizer-Pro-v0.9.17-source organizer/buildsrc0106/Organizer-Pro-v0.9.18-source
          python3 organizer/v0109/apply.py organizer/buildsrc0106/Organizer-Pro-v0.9.18-source
          mv organizer/buildsrc0106/Organizer-Pro-v0.9.18-source organizer/buildsrc0106/Organizer-Pro-v0.9.19-source
          python3 organizer/v0110/apply.py organizer/buildsrc0106/Organizer-Pro-v0.9.19-source
          mv organizer/buildsrc0106/Organizer-Pro-v0.9.19-source organizer/buildsrc0106/Organizer-Pro-v0.9.20-source
          python3 organizer/v0111/apply.py organizer/buildsrc0106/Organizer-Pro-v0.9.20-source
          mv organizer/buildsrc0106/Organizer-Pro-v0.9.20-source organizer/buildsrc0106/Organizer-Pro-v0.9.21-source
          python3 organizer/v0112/apply.py organizer/buildsrc0106/Organizer-Pro-v0.9.21-source
          mv organizer/buildsrc0106/Organizer-Pro-v0.9.21-source organizer/buildsrc0106/Organizer-Pro-v0.9.22-source
          python3 organizer/v0113/apply.py organizer/buildsrc0106/Organizer-Pro-v0.9.22-source
          mv organizer/buildsrc0106/Organizer-Pro-v0.9.22-source organizer/buildsrc0106/Organizer-Pro-v0.9.23-source
          python3 organizer/v0114/apply.py organizer/buildsrc0106/Organizer-Pro-v0.9.23-source
          mv organizer/buildsrc0106/Organizer-Pro-v0.9.23-source organizer/buildsrc0106/Organizer-Pro-v0.9.24-source
          ROOT=organizer/buildsrc0106/Organizer-Pro-v0.9.24-source
          grep -q 'versionCode = 57' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "0.9.24"' "$ROOT/app/build.gradle.kts"
          grep -q 'applicationId = "kz.kairat.organizer"' "$ROOT/app/build.gradle.kts"
          grep -q 'supportedLanguages = listOf("kk","ru","en","zh","de","es","fr","tr")' "$ROOT/app/src/main/java/kz/kairat/organizer/AppStrings.kt"
          grep -q 'SQLiteOpenHelper(context, "organizer.db", null, 9)' "$ROOT/app/src/main/java/kz/kairat/organizer/NoteDatabase.kt"
          grep -q 'android.permission.READ_CALENDAR' "$ROOT/app/src/main/AndroidManifest.xml"
          ! grep -q 'android.permission.WRITE_CALENDAR' "$ROOT/app/src/main/AndroidManifest.xml"
          grep -q 'CalendarContract.Instances.CONTENT_URI' "$ROOT/app/src/main/java/kz/kairat/organizer/CalendarSystem.kt"
          grep -q 'filter{it.kind=="birthday"}' "$ROOT/app/src/main/java/kz/kairat/organizer/CalendarSystem.kt"
          grep -q 'db.getAllProjectStages()' "$ROOT/app/src/main/java/kz/kairat/organizer/CalendarSystem.kt"
          grep -Fq 'if(section!="settings") TopIconAction(Icons.Default.CalendarMonth)' "$ROOT/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt"
          ! grep -Fq 'if(section!="settings") AppLogo(Modifier.size((36f*fontScale' "$ROOT/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt"
          grep -Fq '@Composable private fun RowScope.TopActionPill' "$ROOT/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt"
          grep -Fq 'onDismissRequest=onDismiss' "$ROOT/app/src/main/java/kz/kairat/organizer/CalendarUi.kt"
          grep -Fq 'dismissOnBackPress=true,dismissOnClickOutside=false' "$ROOT/app/src/main/java/kz/kairat/organizer/CalendarUi.kt"
          ! grep -Fq 'Icons.Default.Close' "$ROOT/app/src/main/java/kz/kairat/organizer/CalendarUi.kt"
          grep -Fq 'shape=RoundedCornerShape(0.dp)' "$ROOT/app/src/main/java/kz/kairat/organizer/CalendarUi.kt"
          grep -q 'BirthdayScheduler.rescheduleAll(this)' "$ROOT/app/src/main/java/kz/kairat/organizer/MainActivity.kt"
          grep -q 'organizer_reminders_v3' "$ROOT/app/src/main/java/kz/kairat/organizer/ReminderSystem.kt"
          grep -Fq 'bounds.height()*0.30f' "$ROOT/app/src/main/java/kz/kairat/organizer/ReminderAlertActivity.kt"
          grep -q 'fun getStandaloneMoneyEntries()' "$ROOT/app/src/main/java/kz/kairat/organizer/NoteDatabase.kt"

      - name: Build APK
        if: ${{ hashFiles('organizer/v0114/apply.py') != '' }}
        working-directory: organizer/buildsrc0106/Organizer-Pro-v0.9.24-source
        run: gradle --no-daemon --build-cache assembleDebug

      - name: Upload APK only
        if: ${{ hashFiles('organizer/v0114/apply.py') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-v0.9.24-debug
          path: organizer/buildsrc0106/Organizer-Pro-v0.9.24-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
