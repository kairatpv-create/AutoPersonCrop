name: Build Organizer Pro v0.9.19

on:
  push:
    branches:
      - personal-organizer-v1
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore v0.9.18 and apply v0.9.19 update
        shell: bash
        run: |
          python3 organizer/v0106/rebuild.py
          test -f organizer/buildsrc0106/Organizer-Pro-v0.9.16-source/app/build.gradle.kts
          python3 organizer/v0107/apply.py organizer/buildsrc0106/Organizer-Pro-v0.9.16-source
          mv organizer/buildsrc0106/Organizer-Pro-v0.9.16-source organizer/buildsrc0106/Organizer-Pro-v0.9.17-source
          python3 organizer/v0108/apply.py organizer/buildsrc0106/Organizer-Pro-v0.9.17-source
          mv organizer/buildsrc0106/Organizer-Pro-v0.9.17-source organizer/buildsrc0106/Organizer-Pro-v0.9.18-source
          python3 organizer/v0109/apply.py organizer/buildsrc0106/Organizer-Pro-v0.9.18-source
          mv organizer/buildsrc0106/Organizer-Pro-v0.9.18-source organizer/buildsrc0106/Organizer-Pro-v0.9.19-source
          grep -q 'versionCode = 52' organizer/buildsrc0106/Organizer-Pro-v0.9.19-source/app/build.gradle.kts
          grep -q 'versionName = "0.9.19"' organizer/buildsrc0106/Organizer-Pro-v0.9.19-source/app/build.gradle.kts
          grep -q 'applicationId = "kz.kairat.organizer"' organizer/buildsrc0106/Organizer-Pro-v0.9.19-source/app/build.gradle.kts
          grep -q 'supportedLanguages = listOf("kk","ru","en","zh","de","es","fr","tr")' organizer/buildsrc0106/Organizer-Pro-v0.9.19-source/app/src/main/java/kz/kairat/organizer/AppStrings.kt
          grep -q 'SQLiteOpenHelper(context, "organizer.db", null, 9)' organizer/buildsrc0106/Organizer-Pro-v0.9.19-source/app/src/main/java/kz/kairat/organizer/NoteDatabase.kt
          grep -q 'prefs.getBoolean("projects_enabled", true)' organizer/buildsrc0106/Organizer-Pro-v0.9.19-source/app/src/main/java/kz/kairat/organizer/SettingsStore.kt
          grep -q 'val compactSettings=fontScale<=1.16f' organizer/buildsrc0106/Organizer-Pro-v0.9.19-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt
          grep -q 'verticalArrangement=Arrangement.spacedBy(settingsGap)' organizer/buildsrc0106/Organizer-Pro-v0.9.19-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt
          grep -q 'verticalPadding=controlsCardPad' organizer/buildsrc0106/Organizer-Pro-v0.9.19-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt
          grep -q 'AppLogo(Modifier.size(if(compactSettings)38.dp else 46.dp))' organizer/buildsrc0106/Organizer-Pro-v0.9.19-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt
          grep -q 'if(projectsEnabled) BottomTextNavPill(section=="projects"' organizer/buildsrc0106/Organizer-Pro-v0.9.19-source/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt
          grep -q 'fun getStandaloneMoneyEntries()' organizer/buildsrc0106/Organizer-Pro-v0.9.19-source/app/src/main/java/kz/kairat/organizer/NoteDatabase.kt

      - name: Build APK
        working-directory: organizer/buildsrc0106/Organizer-Pro-v0.9.19-source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-v0.9.19-debug
          path: organizer/buildsrc0106/Organizer-Pro-v0.9.19-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Archive source
        shell: bash
        run: |
          cd organizer/buildsrc0106
          zip -qr ../Organizer-Pro-v0.9.19-source.zip Organizer-Pro-v0.9.19-source

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-v0.9.19-source
          path: organizer/Organizer-Pro-v0.9.19-source.zip
          if-no-files-found: error
          retention-days: 1

      - name: Collect signing tools
        shell: bash
        run: |
          mkdir -p organizer/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" organizer/signing-tools/lib/
          chmod +x organizer/signing-tools/apksigner organizer/signing-tools/zipalign

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35
          path: organizer/signing-tools
          if-no-files-found: error
          retention-days: 1
