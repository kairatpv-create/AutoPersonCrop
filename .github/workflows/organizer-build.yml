name: Build Organizer Pro v0.9.32

on:
  push:
    branches:
      - personal-organizer-v1
    paths:
      - 'organizer/**'
      - '.github/workflows/organizer-build.yml'
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and verify Organizer Pro v0.9.32
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if bash organizer/build_v0932.sh; then
              exit 0
            fi
            echo "Gradle attempt $attempt failed; waiting before retry..."
            sleep $((attempt*45))
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-v0.9.32-debug
          path: organizer/buildsrc0106/Organizer-Pro-v0.9.32-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
