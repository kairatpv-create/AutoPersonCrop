name: Build MyOrganizer v0.8.6

on:
  push:
    branches:
      - personal-organizer-v1
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild v0.8.5 base and apply v0.8.6
        shell: bash
        run: |
          mkdir -p organizer/buildsrc086
          cat \
            organizer/chunks085/part00 \
            organizer/chunks085fix/part01_0 \
            organizer/chunks085fix/part01_1 \
            organizer/chunks085/part02 \
            organizer/chunks085/part03 \
            organizer/chunks085/part04 \
            organizer/chunks085/part05 \
            organizer/chunks085fix/part06_0 \
            organizer/chunks085fix/part06_1 \
            organizer/chunks085fix/part07_0 \
            organizer/chunks085fix/part07_1 \
            organizer/chunks085/part08 \
            > organizer/MyOrganizer-v0.8.5-source.b64
          base64 -d organizer/MyOrganizer-v0.8.5-source.b64 > organizer/MyOrganizer-v0.8.5-source.zip
          unzip -q organizer/MyOrganizer-v0.8.5-source.zip -d organizer/buildsrc086
          cat organizer/patch086/part* > organizer/v0.8.6.patch
          cd organizer/buildsrc086
          patch -p0 < ../v0.8.6.patch

      - name: Build APK
        working-directory: organizer/buildsrc086/MyOrganizer-v0.8.5-source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyOrganizer-v0.8.6-debug
          path: organizer/buildsrc086/MyOrganizer-v0.8.5-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Collect signing tools
        shell: bash
        run: |
          mkdir -p organizer/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" organizer/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" organizer/signing-tools/lib/
          chmod +x organizer/signing-tools/apksigner organizer/signing-tools/zipalign

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35
          path: organizer/signing-tools
          if-no-files-found: error
