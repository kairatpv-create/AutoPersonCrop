name: Simple Photo Editor APK

on:
  push:
    branches: [ simple-photo-editor-v1 ]
    paths:
      - 'SimplePhotoEditor/**'
      - '.github/workflows/simple-photo-editor.yml'
  workflow_dispatch:

concurrency:
  group: simple-photo-editor-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SimplePhotoEditor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: simple-photo-editor-debug-keystore-v1

      - name: Ensure stable debug keystore exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Apply 0.1.15 fixes
        run: python3 tools/apply_0_1_15.py

      - name: Verify version and fixes
        run: |
          grep -q 'versionCode = 16' app/build.gradle.kts
          grep -q 'versionName = "0.1.15"' app/build.gradle.kts
          grep -q 'REQ_DELETE = 104' app/src/main/java/kz/kairat/simplephotoeditor/MainActivity.java
          grep -q 'requestDeleteCurrent' app/src/main/java/kz/kairat/simplephotoeditor/MainActivity.java
          grep -q 'galleryAnchorPosition' app/src/main/java/kz/kairat/simplephotoeditor/MainActivity.java
          grep -q '@quick' app/src/main/java/kz/kairat/simplephotoeditor/MainActivity.java
          grep -q 'editPinchActive' app/src/main/java/kz/kairat/simplephotoeditor/CropEditorView.java

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimplePhotoEditor-0.1.15-debug
          path: SimplePhotoEditor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
