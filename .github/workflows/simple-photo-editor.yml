name: Simple Photo Editor APK

on:
  push:
    branches: [ simple-photo-editor-v1 ]
    paths:
      - 'SimplePhotoEditor/**'
      - '.github/workflows/simple-photo-editor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SimplePhotoEditor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimplePhotoEditor-0.1.0-debug
          path: SimplePhotoEditor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
