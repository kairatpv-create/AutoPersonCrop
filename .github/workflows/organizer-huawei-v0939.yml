name: Organizer Pro Huawei 0.9.40 release
on:
  push:
    branches:
      - work/organizer-huawei-appgallery-0940-20261106
    paths:
      - 'organizer/build_v0940_huawei_ci.sh'
      - '.github/workflows/organizer-huawei-v0939.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Reconstruct and validate Huawei Android build
        run: bash organizer/build_v0940_huawei_ci.sh
      - name: Upload unsigned release APK (sign locally before AppGallery)
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-v0.9.40-73-UNSIGNED-RELEASE
          path: organizer/buildsrc0106/Organizer-Pro-v0.9.38-source/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error
