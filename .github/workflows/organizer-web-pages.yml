name: Publish Organizer Pro Web

on:
  push:
    branches:
      - personal-organizer-web-v1
    paths:
      - 'organizer-web/static/**'
      - '.github/workflows/organizer-web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: organizer-pro-web-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: organizer-web/static

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
