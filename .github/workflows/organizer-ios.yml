name: Organizer Pro iPhone
on:
  push:
    branches: [organizer-ios-20261022]
    paths: ['mobile/ios/**', 'tools/ios/**', '.github/workflows/organizer-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: organizer-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record actual Apple toolchain
        run: |
          mkdir -p ios-evidence
          git rev-parse HEAD > ios-evidence/source-commit.txt
          xcodebuild -version | tee ios-evidence/xcode.txt
          xcodebuild -showsdks | tee ios-evidence/sdks.txt
          swift --version | tee ios-evidence/swift.txt
      - name: Domain, backup and SQLite tests
        run: swift test --package-path mobile/ios/OrganizerCore --parallel
      - name: Cross-platform export and process-death rollback
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path mobile/ios/OrganizerCore --product OrganizerProbe
          PROBE="$(swift build --package-path mobile/ios/OrganizerCore --show-bin-path)/OrganizerProbe"
          FIXTURE="$PWD/mobile/ios/OrganizerCore/Tests/OrganizerCoreTests/Fixtures/android-v6.json"
          "$PROBE" roundtrip "$RUNNER_TEMP/roundtrip.sqlite" "$FIXTURE" "$PWD/ios-evidence/ios-roundtrip.json"
          "$PROBE" seed "$RUNNER_TEMP/crash.sqlite" "$FIXTURE"
          set +e
          "$PROBE" crash "$RUNNER_TEMP/crash.sqlite" unused
          CRASH_STATUS=$?
          set -e
          test "$CRASH_STATUS" = 77
          "$PROBE" verify "$RUNNER_TEMP/crash.sqlite" "$FIXTURE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: organizer-ios-core-evidence
          path: ios-evidence/
          if-no-files-found: error
  iphone:
    needs: core
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify project and Apple environment
        run: |
          mkdir -p ios-evidence
          python3 tools/ios/generate_project.py
          git diff --exit-code mobile/ios/OrganizerPro.xcodeproj
          bash tools/ios/preflight.sh | tee ios-evidence/preflight.txt
          python3 tools/ios/select_simulators.py
      - name: Build the actual iPhone app and tests
        id: build
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$IOS_SMALL_UDID"
          xcrun simctl bootstatus "$IOS_SMALL_UDID" -b
          xcodebuild -project mobile/ios/OrganizerPro.xcodeproj -scheme OrganizerPro -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$IOS_SMALL_UDID" -derivedDataPath "$RUNNER_TEMP/organizer-derived" build-for-testing CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee ios-evidence/build.log
          codesign -d --entitlements :- "$RUNNER_TEMP/organizer-derived/Build/Products/Debug-iphonesimulator/OrganizerPro.app" > ios-evidence/simulator-entitlements.plist 2>/dev/null
      - name: Keychain, import, data and small iPhone UI tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project mobile/ios/OrganizerPro.xcodeproj -scheme OrganizerPro -sdk iphonesimulator -destination "platform=iOS Simulator,id=$IOS_SMALL_UDID" -derivedDataPath "$RUNNER_TEMP/organizer-derived" -resultBundlePath ios-evidence/small-iphone.xcresult -parallel-testing-enabled NO test-without-building CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee ios-evidence/small-tests.log
      - name: Large iPhone RU and EN layout tests
        if: success() && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$IOS_SMALL_UDID" || true
          xcrun simctl boot "$IOS_LARGE_UDID"
          xcrun simctl bootstatus "$IOS_LARGE_UDID" -b
          xcodebuild -project mobile/ios/OrganizerPro.xcodeproj -scheme OrganizerPro -sdk iphonesimulator -destination "platform=iOS Simulator,id=$IOS_LARGE_UDID" -derivedDataPath "$RUNNER_TEMP/organizer-derived" -resultBundlePath ios-evidence/large-iphone.xcresult -parallel-testing-enabled NO -only-testing:OrganizerProUITests/LayoutTests test-without-building CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee ios-evidence/large-tests.log
      - name: Compile an unsigned Release archive for physical iPhone
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project mobile/ios/OrganizerPro.xcodeproj -scheme OrganizerPro -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/organizer-release" -archivePath "$RUNNER_TEMP/Organizer-Pro-iOS-UNSIGNED.xcarchive" archive CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios-evidence/archive.log
          plutil -convert json -o ios-evidence/release-app-info.json "$RUNNER_TEMP/Organizer-Pro-iOS-UNSIGNED.xcarchive/Products/Applications/OrganizerPro.app/Info.plist"
          python3 tools/ios/validate_archive.py "$RUNNER_TEMP/Organizer-Pro-iOS-UNSIGNED.xcarchive" --output ios-evidence/release-verification.json
          xcrun lipo -info "$RUNNER_TEMP/Organizer-Pro-iOS-UNSIGNED.xcarchive/Products/Applications/OrganizerPro.app/OrganizerPro" | tee ios-evidence/architectures.txt
          if strings "$RUNNER_TEMP/Organizer-Pro-iOS-UNSIGNED.xcarchive/Products/Applications/OrganizerPro.app/OrganizerPro" | grep -E 'ORGANIZER_UI_FIXTURE|-ui-testing|-test-session'; then exit 1; fi
          ditto -c -k --keepParent "$RUNNER_TEMP/Organizer-Pro-iOS-UNSIGNED.xcarchive" ios-evidence/Organizer-Pro-iOS-UNSIGNED.xcarchive.zip
      - name: Export screenshots
        if: always()
        shell: bash
        run: |
          for result in ios-evidence/*.xcresult; do
            if [ -d "$result" ]; then
              xcrun xcresulttool export attachments --path "$result" --output-path "${result%.xcresult}-screenshots" || true
              xcrun xcresulttool get test-results summary --path "$result" > "${result%.xcresult}-summary.json" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: organizer-iphone-build-and-tests
          path: ios-evidence/
          if-no-files-found: error
          retention-days: 30
