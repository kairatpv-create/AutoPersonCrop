name: Organizer Pro — App Store release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/organizer-appstore-release.yml']
  workflow_dispatch:
    inputs:
      upload_to_app_store_connect:
        description: "Upload signed IPA to App Store Connect after verification"
        type: boolean
        required: true
        default: true
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: apple-distribution
    steps:
      - uses: actions/checkout@v4
        with:
          ref: organizer-ios-20261022
      - name: Check required signing configuration
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12_B64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for var in TEAM_ID P12_B64 P12_PASSWORD PROFILE_B64 API_KEY_B64 API_KEY_ID API_ISSUER; do
            if [ -z "${!var:-}" ]; then echo "::error::Missing required Apple signing configuration: $var"; exit 1; fi
          done
      - name: Import distribution certificate and provisioning profile
        env:
          P12_B64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/apple-signing" "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$P12_B64" | base64 -D > "$RUNNER_TEMP/apple-signing/distribution.p12"
          printf '%s' "$PROFILE_B64" | base64 -D > "$RUNNER_TEMP/apple-signing/profile.mobileprovision"
          printf '%s' "$API_KEY_B64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          security create-keychain -p "${RUNNER_TEMP##*/}" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "${RUNNER_TEMP##*/}" "$RUNNER_TEMP/release.keychain-db"
          if ! openssl pkcs12 -in "$RUNNER_TEMP/apple-signing/distribution.p12" -noout -passin env:P12_PASSWORD >/dev/null 2>&1; then
            echo "::error::P12 verification failed: stored P12 bytes and password do not match, or file is invalid"
            exit 1
          fi
          echo "P12/password match verified by OpenSSL"
          # OpenSSL 4 PKCS#12 encryption may be unsupported by Apple's Security framework.
          # Re-wrap locally using legacy-compatible 3DES and SHA-1, preserving the same key/cert.
          brew install openssl@3
          OPENSSL3="$(brew --prefix openssl@3)/bin/openssl"
          "$OPENSSL3" pkcs12 -in "$RUNNER_TEMP/apple-signing/distribution.p12" -passin env:P12_PASSWORD -nodes -out "$RUNNER_TEMP/apple-signing/unwrapped.pem"
          "$OPENSSL3" pkcs12 -export -in "$RUNNER_TEMP/apple-signing/unwrapped.pem" -passout env:P12_PASSWORD -out "$RUNNER_TEMP/apple-signing/compatible.p12" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          rm -f "$RUNNER_TEMP/apple-signing/unwrapped.pem"
          "$OPENSSL3" pkcs12 -in "$RUNNER_TEMP/apple-signing/compatible.p12" -noout -passin env:P12_PASSWORD
          security import "$RUNNER_TEMP/apple-signing/compatible.p12" -k "$RUNNER_TEMP/release.keychain-db" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "${RUNNER_TEMP##*/}" "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db"
          security cms -D -i "$RUNNER_TEMP/apple-signing/profile.mobileprovision" > "$RUNNER_TEMP/apple-signing/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/apple-signing/profile.plist" > "$RUNNER_TEMP/apple-signing/uuid"
          PROFILE_UUID="$(cat "$RUNNER_TEMP/apple-signing/uuid")"
          cp "$RUNNER_TEMP/apple-signing/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/apple-signing/profile.plist" | grep -Fx "${{ secrets.APPLE_TEAM_ID }}.com.organizerpro.mobile" >/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$RUNNER_TEMP/apple-signing/profile.plist" 2>/dev/null || true)" != "true"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
      - name: Generate and check Xcode project
        run: |
          python3 tools/ios/generate_project.py
          git diff --exit-code mobile/ios/OrganizerPro.xcodeproj
          bash tools/ios/preflight.sh
      - name: Archive signed iPhone app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project mobile/ios/OrganizerPro.xcodeproj -scheme OrganizerPro -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/OrganizerPro.xcarchive" archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"
          codesign --verify --deep --strict "$RUNNER_TEMP/OrganizerPro.xcarchive/Products/Applications/OrganizerPro.app"
          python3 tools/ios/validate_archive.py "$RUNNER_TEMP/OrganizerPro.xcarchive" --output "$RUNNER_TEMP/release-verification.json"
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p["archiveSignedForDistribution"] is True, p' "$RUNNER_TEMP/release-verification.json"
      - name: Export signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict><key>com.organizerpro.mobile</key><string>$PROFILE_UUID</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OrganizerPro.xcarchive" -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          test -f "$RUNNER_TEMP/ipa/OrganizerPro.ipa"
      - name: Upload to App Store Connect
        if: github.event_name == 'push' || inputs.upload_to_app_store_connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/ipa/OrganizerPro.ipa" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: organizer-pro-signed-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
