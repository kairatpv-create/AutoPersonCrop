name: Cleanup Actions storage once

on:
  push:
    branches: [ cleanup-actions-storage ]
    paths:
      - '.github/workflows/cleanup-actions-storage.yml'

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all Actions artifacts in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id')"
          if [ -z "$ids" ]; then
            echo "No artifacts to delete."
            exit 0
          fi
          count=0
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            count=$((count+1))
          done <<< "$ids"
          echo "Deleted $count artifacts."
