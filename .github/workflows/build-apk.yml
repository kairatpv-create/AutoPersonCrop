name: Build Android APK

on:
  push:
    branches: [android-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode ci/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -storetype JKS -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache exported LiteRT model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/person_detector.tflite
          key: yolo11n-litert-8.4.127-${{ hashFiles('tools/export_model.py') }}

      - name: Export YOLO11n to LiteRT
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ultralytics==8.4.127" "litert-torch>=0.9.0" "ai-edge-litert>=2.1.4"
          python tools/export_model.py

      - name: Verify model exists
        run: test -s app/src/main/assets/person_detector.tflite

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-output.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoPersonCrop-build-log
          path: build-output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoPersonCrop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
