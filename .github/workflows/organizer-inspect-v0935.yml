name: Inspect Organizer Pro v0.9.35 text scaling

on:
  push:
    branches: [personal-organizer-v1]
    paths:
      - '.github/workflows/organizer-inspect-v0935.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v0.9.35 and print text-scale context
        shell: bash
        run: |
          set -euo pipefail
          awk '/^gradle --no-daemon/{exit} {print}' organizer/build_v0935_ci.sh > /tmp/reconstruct_v0935.sh
          bash /tmp/reconstruct_v0935.sh
          ROOT=organizer/buildsrc0106/Organizer-Pro-v0.9.35-source
          UI="$ROOT/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt"
          echo '=== SCALE REFERENCES ==='
          grep -nE 'LocalContentTextScale|fontScale|buttonScale|CompositionLocalProvider|MoneyOverview|MoneySummary|Summary|TextField|OutlinedTextField' "$UI" || true
          echo '=== MONEY REGION ==='
          LINE=$(grep -n 'fun MoneyOverview' "$UI" | head -1 | cut -d: -f1 || true)
          if [ -n "$LINE" ]; then
            START=$((LINE-80)); [ $START -lt 1 ] && START=1
            END=$((LINE+180))
            sed -n "${START},${END}p" "$UI"
          fi
          echo '=== APP/THEME REGION ==='
          grep -nE 'MaterialTheme|LocalContentTextScale|CompositionLocalProvider' "$UI" | head -80 || true
