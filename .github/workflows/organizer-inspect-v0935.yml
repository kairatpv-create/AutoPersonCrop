name: Inspect Organizer Pro v0.9.35 text scaling

on:
  push:
    branches: [personal-organizer-v1]
    paths:
      - '.github/workflows/organizer-inspect-v0935.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v0.9.35 and print text-scale context
        shell: bash
        run: |
          set -euo pipefail
          awk '/^gradle --no-daemon/{exit} {print}' organizer/build_v0935_ci.sh > /tmp/reconstruct_v0935.sh
          bash /tmp/reconstruct_v0935.sh
          ROOT=organizer/buildsrc0106/Organizer-Pro-v0.9.35-source
          UI="$ROOT/app/src/main/java/kz/kairat/organizer/OrganizerUi.kt"
          echo '=== TOP 55-215 ==='
          sed -n '55,215p' "$UI"
          echo '=== MONEY TAB PILL ==='
          LINE=$(grep -n 'fun MoneyTabPill' "$UI" | head -1 | cut -d: -f1 || true)
          if [ -n "$LINE" ]; then START=$((LINE-20)); END=$((LINE+70)); sed -n "${START},${END}p" "$UI"; fi
          echo '=== TEXT SCALE HELPERS ==='
          grep -nE 'LocalContentTextScale|CompositionLocalProvider|ProvideTextStyle|copy\(fontSize|fontScale|buttonScale|buttonFont' "$UI" || true
