name: Inspect Organizer Pro v0.9.35 text scaling

on:
  push:
    branches: [personal-organizer-v1]
    paths:
      - '.github/workflows/organizer-inspect-v0935.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v0.9.35 and print text-scale context
        shell: bash
        run: |
          set -euo pipefail
          awk '/^gradle --no-daemon/{exit} {print}' organizer/build_v0935_ci.sh > /tmp/reconstruct_v0935.sh
          bash /tmp/reconstruct_v0935.sh
          ROOT=organizer/buildsrc0106/Organizer-Pro-v0.9.35-source
          BASE="$ROOT/app/src/main/java/kz/kairat/organizer"
          echo '=== THEME FILE MATCHES ==='
          grep -Rnl 'fun OrganizerTheme\|LocalContentTextScale\|LocalButtonTextScale' "$BASE" || true
          for f in $(grep -Rl 'fun OrganizerTheme\|LocalContentTextScale\|LocalButtonTextScale' "$BASE" || true); do
            echo "=== FILE $f ==="
            cat "$f"
          done
