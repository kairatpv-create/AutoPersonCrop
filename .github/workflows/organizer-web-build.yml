name: Build Organizer Pro Web v0.5.3

on:
  push:
    branches:
      - personal-organizer-web-v1
    paths:
      - 'organizer-web/static/**'
      - 'organizer-sync-server/**'
      - 'render.yaml'
      - '.github/workflows/organizer-web-build.yml'
      - '.github/workflows/organizer-web-pages.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: organizer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Organizer Pro web and server files
        shell: bash
        run: |
          test -f organizer-web/static/index.html
          test -f organizer-web/static/app.js
          test -f organizer-web/static/ui-fix.js
          test -f organizer-web/static/style.css
          test -f organizer-web/static/sync.js
          test -f organizer-web/static/sync.css
          test -f organizer-web/static/manifest.webmanifest
          test -f organizer-web/static/sw.js
          test -f organizer-web/static/icon.svg
          test -f organizer-sync-server/server.js
          test -f organizer-sync-server/package.json
          test -f render.yaml
          grep -q 'WEB 0.5.3' organizer-web/static/index.html
          grep -q "organizer-pro-web-0.5.3" organizer-web/static/sw.js
          grep -q '<script src="ui-fix.js"></script>' organizer-web/static/index.html
          grep -q "'./ui-fix.js'" organizer-web/static/sw.js
          grep -q "data-note" organizer-web/static/ui-fix.js
          grep -q "data-project" organizer-web/static/ui-fix.js
          grep -q "saveNote" organizer-web/static/ui-fix.js
          grep -q "saveProject" organizer-web/static/ui-fix.js
          grep -q "Сохранить" organizer-web/static/ui-fix.js
          grep -q 'manifest.webmanifest' organizer-web/static/index.html
          grep -q 'serviceWorker' organizer-web/static/index.html
          grep -q '<script src="sync.js"></script>' organizer-web/static/index.html
          ! grep -q 'cloud-config.js' organizer-web/static/index.html
          ! grep -q 'type="module"' organizer-web/static/index.html
          ! grep -q 'Project ID' organizer-web/static/sync.js
          ! grep -q 'Web API key' organizer-web/static/sync.js
          ! grep -q 'Firebase' organizer-web/static/sync.js
          ! grep -q 'location.reload' organizer-web/static/sync.js
          grep -q 'organizer:cloud-applied' organizer-web/static/app.js
          grep -q 'organizer:local-change' organizer-web/static/app.js
          grep -q 'organizer:local-change' organizer-web/static/sync.js
          grep -q 'recentLocalChange' organizer-web/static/sync.js
          grep -q 'mergePayloads' organizer-web/static/sync.js
          grep -q 'scan(r.notes);scan(r.projects);scan(r.projectStages);scan(r.money);scan(r.reminders)' organizer-web/static/sync.js
          ! grep -q "scan(r.reminders.*triggerAt" organizer-web/static/sync.js
          grep -q "'/api/auth/'" organizer-web/static/sync.js
          grep -q "create?'register':'login'" organizer-web/static/sync.js
          grep -q "'/api/sync'" organizer-web/static/sync.js
          grep -q 'autoSync' organizer-web/static/sync.js
          grep -q 'beforeinstallprompt' organizer-web/static/sync.js
          grep -q "app.post('/api/auth/register'" organizer-sync-server/server.js
          grep -q "app.post('/api/auth/login'" organizer-sync-server/server.js
          grep -q "app.get('/api/sync'" organizer-sync-server/server.js
          grep -q "app.put('/api/sync'" organizer-sync-server/server.js
          grep -q 'express.static' organizer-sync-server/server.js
          grep -q 'organizer-pro.app' organizer-sync-server/server.js
          node --check organizer-web/static/app.js
          node --check organizer-web/static/ui-fix.js
          node --check organizer-web/static/sync.js
          node --check organizer-web/static/sw.js
          node --check organizer-sync-server/server.js
          python3 -m json.tool organizer-web/static/manifest.webmanifest >/dev/null
          python3 - <<'PY'
          import json
          p=json.load(open('organizer-sync-server/package.json'))
          assert p['name']=='organizer-pro-sync-server'
          assert 'express' in p['dependencies'] and 'pg' in p['dependencies'] and 'bcryptjs' in p['dependencies']
          PY

      - name: Install server dependencies
        working-directory: organizer-sync-server
        run: npm install --omit=dev --no-audit --no-fund

      - name: Start Organizer Pro test server
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/organizer_test
          JWT_SECRET: organizer-pro-ci-secret-0123456789abcdef0123456789
          TOKEN_DAYS: '30'
          ALLOWED_ORIGINS: http://127.0.0.1:10000
          NODE_ENV: test
          PORT: '10000'
        run: |
          node organizer-sync-server/server.js > /tmp/organizer-server.log 2>&1 &
          echo $! > /tmp/organizer-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:10000/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

      - name: Test account and sync API roundtrip
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          base='http://127.0.0.1:10000'
          def req(path, method='GET', body=None, token=None):
              data=None if body is None else json.dumps(body).encode()
              h={'Content-Type':'application/json'}
              if token: h['Authorization']='Bearer '+token
              r=urllib.request.Request(base+path,data=data,headers=h,method=method)
              with urllib.request.urlopen(r,timeout=10) as x:
                  return json.loads(x.read().decode())
          reg=req('/api/auth/register','POST',{'email':'ci@organizer-pro.app','password':'Test12345'})
          assert reg['token']
          login=req('/api/auth/login','POST',{'email':'ci@organizer-pro.app','password':'Test12345'})
          token=login['token']
          empty=req('/api/sync',token=token)
          assert empty['exists'] is False and empty['rev']==0
          payload=json.dumps({'format':'my-organizer-backup','version':7,'createdAt':0,'cloudSchema':'organizer-sync-v3','notes':[{'id':1,'title':'CI','body':'ok','createdAt':1,'updatedAt':1,'colorKey':'blue'}],'tasks':[],'projects':[],'projectStages':[],'projectJournal':[],'projectNoteLinks':[],'money':[],'reminders':[]},separators=(',',':'))
          put=req('/api/sync','PUT',{'payload':payload,'baseRev':0},token)
          assert put['ok'] is True and put['rev']==1
          got=req('/api/sync',token=token)
          assert got['exists'] is True and got['rev']==1 and got['payload']==payload
          print('API roundtrip OK')
          PY

      - name: Test served web app in Chrome
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom http://127.0.0.1:10000/ > /tmp/organizer-dom.html
          grep -q 'Органайзер Про' /tmp/organizer-dom.html
          grep -q 'WEB 0.5.3' /tmp/organizer-dom.html
          grep -q 'Заметки' /tmp/organizer-dom.html
          grep -q 'Создать' /tmp/organizer-dom.html
          grep -q 'Сохранить' /tmp/organizer-dom.html
          grep -q 'Войти' /tmp/organizer-dom.html
          ! grep -q 'Project ID' /tmp/organizer-dom.html
          ! grep -q 'Web API key' /tmp/organizer-dom.html
          ! grep -q 'Firebase' /tmp/organizer-dom.html
          ! grep -q 'Ошибка запуска веб-версии' /tmp/organizer-dom.html

      - name: Upload web package
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-Web-v0.5.3
          path: organizer-web/static/
          if-no-files-found: error
          retention-days: 7
