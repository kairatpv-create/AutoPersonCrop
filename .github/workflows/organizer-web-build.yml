name: Build Organizer Pro Web Static

on:
  push:
    branches:
      - personal-organizer-web-v1
    paths:
      - 'organizer-web/static/**'
      - '.github/workflows/organizer-web-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static files
        shell: bash
        run: |
          test -f organizer-web/static/index.html
          test -f organizer-web/static/app.js
          test -f organizer-web/static/style.css
          grep -q '<script src="app.js"></script>' organizer-web/static/index.html
          grep -q '<link rel="stylesheet" href="style.css">' organizer-web/static/index.html
          ! grep -q 'type="module"' organizer-web/static/index.html
          ! grep -q 'firebase' organizer-web/static/index.html
          ! grep -q 'import ' organizer-web/static/app.js
          node --check organizer-web/static/app.js

      - name: Test direct file opening in Chrome
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME"
          URL="file://$GITHUB_WORKSPACE/organizer-web/static/index.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=2500 --dump-dom "$URL" > /tmp/organizer-dom.html
          grep -q 'Органайзер Про' /tmp/organizer-dom.html
          grep -q 'Заметки' /tmp/organizer-dom.html
          grep -q 'Создать' /tmp/organizer-dom.html
          ! grep -q 'Ошибка запуска веб-версии' /tmp/organizer-dom.html

      - name: Upload portable web folder
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-Web-v0.2.0-static
          path: organizer-web/static/
          if-no-files-found: error
          retention-days: 7
