name: Build Organizer Pro Web v0.4.0 PWA

on:
  push:
    branches:
      - personal-organizer-web-v1
    paths:
      - 'organizer-web/static/**'
      - 'organizer-web/firestore.rules'
      - '.github/workflows/organizer-web-build.yml'
      - '.github/workflows/organizer-web-pages.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public-ready web files
        shell: bash
        run: |
          test -f organizer-web/static/index.html
          test -f organizer-web/static/app.js
          test -f organizer-web/static/style.css
          test -f organizer-web/static/sync.js
          test -f organizer-web/static/sync.css
          test -f organizer-web/static/cloud-config.js
          test -f organizer-web/static/manifest.webmanifest
          test -f organizer-web/static/sw.js
          test -f organizer-web/static/icon.svg
          test -f organizer-web/firestore.rules
          grep -q 'WEB 0.4.0' organizer-web/static/index.html
          grep -q 'manifest.webmanifest' organizer-web/static/index.html
          grep -q 'serviceWorker' organizer-web/static/index.html
          grep -q '<script src="cloud-config.js"></script>' organizer-web/static/index.html
          grep -q '<script src="sync.js"></script>' organizer-web/static/index.html
          ! grep -q 'type="module"' organizer-web/static/index.html
          ! grep -q 'Project ID' organizer-web/static/sync.js
          ! grep -q 'Web API key' organizer-web/static/sync.js
          ! grep -q 'Сервер Firebase' organizer-web/static/sync.js
          grep -q 'autoSync' organizer-web/static/sync.js
          grep -q 'beforeinstallprompt' organizer-web/static/sync.js
          grep -q 'identitytoolkit.googleapis.com' organizer-web/static/sync.js
          grep -q 'firestore.googleapis.com' organizer-web/static/sync.js
          grep -q 'request.auth.uid == userId' organizer-web/firestore.rules
          node --check organizer-web/static/app.js
          node --check organizer-web/static/cloud-config.js
          node --check organizer-web/static/sync.js
          node --check organizer-web/static/sw.js
          python3 -m json.tool organizer-web/static/manifest.webmanifest >/dev/null

      - name: Test direct file opening in Chrome
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME"
          URL="file://$GITHUB_WORKSPACE/organizer-web/static/index.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=3000 --dump-dom "$URL" > /tmp/organizer-dom.html
          grep -q 'Органайзер Про' /tmp/organizer-dom.html
          grep -q 'Заметки' /tmp/organizer-dom.html
          grep -q 'Создать' /tmp/organizer-dom.html
          grep -q 'Войти' /tmp/organizer-dom.html
          ! grep -q 'Project ID' /tmp/organizer-dom.html
          ! grep -q 'Web API key' /tmp/organizer-dom.html
          ! grep -q 'Сервер Firebase' /tmp/organizer-dom.html
          ! grep -q 'Ошибка запуска веб-версии' /tmp/organizer-dom.html

      - name: Upload portable fallback
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-Web-v0.4.0-PWA
          path: organizer-web/static/
          if-no-files-found: error
          retention-days: 7
