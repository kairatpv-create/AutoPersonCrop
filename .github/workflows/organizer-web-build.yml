name: Build Organizer Pro Web

on:
  push:
    branches:
      - personal-organizer-web-v1
    paths:
      - 'organizer-web/**'
      - '.github/workflows/organizer-web-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: organizer-web/package-lock.json
      - name: Install
        working-directory: organizer-web
        run: npm install --package-lock-only && npm ci
      - name: Build
        working-directory: organizer-web
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-Web-v0.1
          path: organizer-web/dist
          if-no-files-found: error
          retention-days: 7
