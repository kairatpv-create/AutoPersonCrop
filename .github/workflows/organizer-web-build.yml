name: Build Organizer Pro Web

on:
  push:
    branches:
      - personal-organizer-web-v1
    paths:
      - 'organizer-web/**'
      - '.github/workflows/organizer-web-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: organizer-web
        run: npm install
      - name: Build portable web app
        working-directory: organizer-web
        run: npm run build
      - name: Verify one-file portable output
        working-directory: organizer-web
        run: |
          test -f dist/index.html
          test ! -d dist/assets
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          grep -q 'name="organizer-portable" content="true"' dist/index.html
          ! grep -q 'type="module"' dist/index.html
          ! grep -q 'assets/' dist/index.html
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-Web-v0.1.4-portable
          path: organizer-web/dist/index.html
          if-no-files-found: error
          retention-days: 7
