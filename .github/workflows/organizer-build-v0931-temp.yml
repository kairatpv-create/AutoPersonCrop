name: Build Organizer Pro v0.9.31 Final Temp

on:
  push:
    branches:
      - personal-organizer-v1-final-temp
    paths:
      - 'organizer/v0121/**'
      - 'organizer/build_v0931.sh'
      - '.github/workflows/organizer-build-v0931-temp.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-organizer-v1-final-temp
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and verify Organizer Pro v0.9.31
        shell: bash
        run: bash organizer/build_v0931.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Organizer-Pro-v0.9.31-debug
          path: organizer/buildsrc0106/Organizer-Pro-v0.9.31-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
