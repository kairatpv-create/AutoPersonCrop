name: Verify Organizer Pro APK candidate
on:
  push:
    branches: [organizer-sync-release-safety-20261022, organizer-android-apk-20261022]
    paths:
      - 'mobile/android/**'
      - 'organizer-sync-server/**'
      - 'tools/audit/**'
      - '.github/workflows/organizer-sync-safety.yml'
permissions:
  contents: read
concurrency:
  group: organizer-sync-safety-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/organizer-android-apk-20261022' }}
jobs:
  server-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-only-local
          POSTGRES_DB: organizer_synthetic_safety
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: organizer-sync-server
      - name: Test HTTP routes and real PostgreSQL concurrency
        env:
          ORGANIZER_SYNTHETIC_ONLY: '1'
          ORGANIZER_SYNTHETIC_PG_URL: postgres://synthetic:synthetic-only-local@127.0.0.1:5432/organizer_synthetic_safety
          ORGANIZER_AUDIT_NODE_MODULES: ${{ github.workspace }}/organizer-sync-server/node_modules
        run: node tools/audit/run_sync_server_safety.cjs organizer-sync-server/server.js server-safety-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-postgres-test-results
          path: server-safety-results.json
          retention-days: 14
  android-emulator:
    env:
      ORGANIZER_CI_KEYSTORE: /tmp/organizer-ci-test.jks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36 for publication preparation
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.ref != 'refs/heads/organizer-android-apk-20261022' }}
      - name: Create disposable test signing identity
        run: |
          keytool -genkeypair -noprompt -keystore "$ORGANIZER_CI_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Organizer Pro Synthetic CI" -keyalg RSA -keysize 2048 -validity 30
          cat > "$RUNNER_TEMP/organizer-ci-signing.init.gradle" <<'GROOVY'
          gradle.beforeProject { project ->
            project.pluginManager.withPlugin('com.android.application') {
                def debugSigning = project.extensions.getByName('android').signingConfigs.getByName('debug')
                debugSigning.storeFile = new File(System.getenv('ORGANIZER_CI_KEYSTORE'))
                debugSigning.storePassword = 'android'
                debugSigning.keyPassword = 'android'
                debugSigning.keyAlias = 'androiddebugkey'
            }
          }
          GROOVY
      - name: Reconstruct version 71 storage baseline for synthetic update test
        run: |
          git fetch --depth=1 origin 86a0fcc51d41ac0f53cad9463d751df27e2b03a9
          mkdir legacy-version71
          git archive 86a0fcc51d41ac0f53cad9463d751df27e2b03a9 mobile/android | tar -x -C legacy-version71
          sed -i 's/compileSdk = 35/compileSdk = 36/' legacy-version71/mobile/android/app/build.gradle.kts
          gradle --no-daemon --build-cache --init-script "$RUNNER_TEMP/organizer-ci-signing.init.gradle" -p legacy-version71/mobile/android assembleDebug
      - name: Compile candidate Android, tests and release APKs
        run: gradle --no-daemon --build-cache --init-script "$RUNNER_TEMP/organizer-ci-signing.init.gradle" -p mobile/android assembleDebug assembleDebugAndroidTest assembleRelease
      - name: Sign release staging APK for emulator testing only
        run: |
          mkdir organizer-apk-stage
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$ORGANIZER_CI_KEYSTORE" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out organizer-apk-stage/Organizer-Pro-v0.9.39-staging.apk mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs organizer-apk-stage/Organizer-Pro-v0.9.39-staging.apk > organizer-apk-stage/staging-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 organizer-apk-stage/Organizer-Pro-v0.9.39-staging.apk
          git rev-parse HEAD > organizer-apk-stage/source-commit.txt
          sha256sum organizer-apk-stage/Organizer-Pro-v0.9.39-staging.apk > organizer-apk-stage/staging-sha256.txt
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android data, restart, crash and offline checks
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORGANIZER_SYNTHETIC_ONLY: '1'
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/audit/run_android_safety.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-android-test-results
          path: android-safety-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: organizer-0.9.39-tested-staging
          path: organizer-apk-stage/
          retention-days: 14
