<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Органайзер Про Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="fatal" class="fatal" hidden></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Органайзер Про <small>WEB 0.3.0</small></div>
      <button class="nav active" data-section="notes">Заметки</button>
      <button class="nav" data-section="projects">Проекты</button>
      <button class="nav" data-section="money">Финансы</button>
      <button class="nav" data-section="settings">Настройки</button>
      <div id="storageStatus" class="status">Локальный режим</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="calendarBtn" class="accent">Календарь</button>
        <div class="spacer"></div>
        <span class="mode">Локально • облако не настроено</span>
      </header>

      <section id="notesSection" class="section"></section>
      <section id="projectsSection" class="section" hidden></section>
      <section id="moneySection" class="section" hidden></section>
      <section id="settingsSection" class="section" hidden></section>
    </main>
  </div>

  <div id="calendarView" class="calendar-view" hidden>
    <div class="calendar-head">
      <button id="calendarBack">Назад</button>
      <button id="prevMonth">‹</button>
      <h2 id="calendarTitle">Календарь</h2>
      <button id="nextMonth">›</button>
      <button id="calendarToday">Сегодня</button>
    </div>
    <div class="weekdays">
      <b>Пн</b><b>Вт</b><b>Ср</b><b>Чт</b><b>Пт</b><b>Сб</b><b>Вс</b>
    </div>
    <div id="calendarGrid" class="calendar-grid"></div>
  </div>

  <noscript><div class="noscript">Для работы Органайзера нужно разрешить JavaScript в браузере.</div></noscript>
  <script src="app.js"></script>
  <script src="sync.js"></script>
</body>
</html>
